    // Sound FX (Hydro Chime synthesized via Web Audio)
    let audioCtx = null;
    function playHydroChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
        osc.frequency.exponentialRampToValueAtTime(1318.5, audioCtx.currentTime + 0.25); // E6
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.45);
      } catch (e) {
        // Audio policy fallback
      }
    }

    // Modal Control
    const modal = document.getElementById('project-modal');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    const modalTag = document.getElementById('modal-tag');
    const modalBody = document.getElementById('modal-body');
    const modalTechStack = document.getElementById('modal-tech-stack');

    function openProjectModal(projectId) {
      const data = projectsData[projectId];
      if (!data) return;

      modalImg.src = data.img;
      modalImg.alt = data.title;
      modalTitle.textContent = data.title;
      modalTag.textContent = data.tag;
      modalBody.textContent = data.desc;

      modalTechStack.innerHTML = '';
      data.tech.forEach(tech => {
        const chip = document.createElement('span');
        chip.className = 'tech-chip';
        chip.textContent = tech;
        modalTechStack.appendChild(chip);
      });

      playHydroChime();
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeProjectModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';

      }

    function closeAboutMeModal() {
      if (aboutMeModal) {
        aboutMeModal.classList.remove('active');
        aboutMeModal.setAttribute('aria-hidden', 'true');
        if (!modal.classList.contains('active')) {
          document.body.style.overflow = '';

    }

    // Close About Me Modal events

      bookBackBtn.addEventListener('click', (e) => {

        playHydroChime();
        closeAboutMeModal();
      });
    }
    if (bookClasp) bookClasp.addEventListener('click', closeAboutMeModal);
    if (aboutMeModal) {
      aboutMeModal.addEventListener('click', (e) => {
        if (e.target === aboutMeModal) {
          closeAboutMeModal();

    // Book Heatmap Project Links (Clicking project inside book closes book and opens project modal)

    // Attach click events to project cards

    /* =======================================================
       SUBTLE HYDRO AMBIENT PARTICLES (BUBBLES & WATER MOTES)
       ======================================================= */
    (function initHydroAtmosphere() {
      const canvas = document.getElementById('elemental-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let particles = [];
      let animId = null;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      class HydroBubble {
        constructor(isInitial = false) {
          this.reset(isInitial);
        }
        reset(isInitial = false) {
          this.x = Math.random() * width;
          this.y = isInitial ? Math.random() * height : height + Math.random() * 40 + 10;
          this.radius = Math.random() * 4.5 + 2.5; // delicate bubble size 2.5px - 7px
          this.speedY = -(Math.random() * 0.45 + 0.35); // gentle floating upward
          this.wobble = Math.random() * Math.PI * 2;
          this.wobbleSpeed = Math.random() * 0.025 + 0.015;
          this.wobbleAmp = Math.random() * 0.8 + 0.4;
          this.alpha = Math.random() * 0.4 + 0.25;
          this.maxAlpha = this.alpha;
          this.isMote = Math.random() < 0.3; // 30% are tiny aquatic shimmers
          if (this.isMote) {
            this.radius = Math.random() * 1.5 + 0.8;
            this.speedY = -(Math.random() * 0.3 + 0.2);
          }
        }
        update() {
          this.y += this.speedY;
          this.wobble += this.wobbleSpeed;
          this.x += Math.sin(this.wobble) * this.wobbleAmp;

          // Fade near top edge
          if (this.y < height * 0.15) {
            this.alpha = Math.max(0, this.maxAlpha * (this.y / (height * 0.15)));
          }

          if (this.y < -20 || this.alpha <= 0) {
            this.reset(false);
          }
        }
        draw() {
          ctx.save();
          if (this.isMote) {
            // Glowing water shimmer mote
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#64b5f6';
            ctx.fillStyle = `rgba(160, 240, 250, ${this.alpha * 0.85})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Translucent glowing aqua bubble
            ctx.shadowBlur = 7;
            ctx.shadowColor = '#19d3f5';
            
            // Soft aqua body fill
            ctx.fillStyle = `rgba(0, 118, 222, ${this.alpha * 0.18})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();

            // Rim stroke
            ctx.strokeStyle = `rgba(100, 181, 246, ${Math.min(1, this.alpha * 1.1)})`;
            ctx.lineWidth = 1.1;
            ctx.stroke();

            // Specular reflection highlight dot
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.85})`;
            ctx.beginPath();
            ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, this.radius * 0.26, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      const PARTICLE_COUNT = 36;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new HydroBubble(true));
      }

      function loop() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        animId = requestAnimationFrame(loop);
      }

      animId = requestAnimationFrame(loop);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animId) cancelAnimationFrame(animId);
          animId = null;
        } else if (!animId) {
          animId = requestAnimationFrame(loop);
        }
      });
    })();
