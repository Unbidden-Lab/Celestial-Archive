  <!-- ==================== 4. INTERACTION LOGIC & AUDIO ==================== -->
  <script>
    // Project Information Database (Accurate to Cedrick's Mockup Data)
    const projectsData = {
      'luntian': {
        title: 'Luntian Flower Shop',
        tag: 'LUNTIAN FLOWER SHOP • Full-stack e-commerce web platform.',
        img: './assets/cedrick/card_luntian.png',
        desc: 'A modern full-stack e-commerce web platform for floral arrangements and botanical gifts, featuring bespoke UI/UX design, interactive product catalogs, seamless cart management, and secure checkout integration.',
        tech: ['Next.js', 'React', 'Tailwind CSS', 'Node.js', 'Stripe API', 'PostgreSQL']
      },
      'maternal-health': {
        title: 'PH Maternal Health Dashboard',
        tag: 'PH MATERNAL HEALTH DASHBOARD • Responsive Philippine maternal mortality data dashboard',
        img: './assets/cedrick/card_maternal_health.png',
        desc: 'An impactful responsive health data visualization platform monitoring Philippine maternal mortality rates and regional healthcare indices, enabling epidemiological insights and policy awareness through interactive geospatial maps and charts.',
        tech: ['Data Analytics', 'Python', 'D3.js / Chart.js', 'GIS Mapping', 'UI/UX Design']
      },
      'closed-open': {
        title: 'Closed;Open',
        tag: 'CLOSED:OPEN • Narrative game feat. Ethan & Noah.',
        img: './assets/cedrick/card_closed_open.png',
        desc: 'An evocative narrative game exploring branching choices, character relationships, and emotional storytelling featuring protagonists Ethan & Noah, developed with customized interactive dialogue mechanics.',
        tech: ['Unity', 'C#', 'Narrative Design', 'Figma', 'Digital Art']
      },
      'ecoality': {
        title: 'Ecoality',
        tag: 'ECOALITY • HAWK-A-THON • Hackathon UI/UX prototype designed in Figma.',
        img: './assets/cedrick/card_ecoality.png',
        desc: 'Award-winning environmental tracking application prototype designed for the Hawk-A-Thon hackathon, empowering communities through gamified ecological milestones and carbon reduction analytics.',
        tech: ['UI/UX Design', 'Figma Prototype', 'Design Systems', 'User Research', 'Sustainability']
      },
      'otaku-shelf': {
        title: 'Otaku Shelf',
        tag: 'OTAKU SHELF • Engaging, intuitive UI/UX platform for anime and manga enthusiasts',
        img: './assets/cedrick/card_otaku_shelf.png',
        desc: 'A community-focused web platform designed for anime and manga enthusiasts to track watchlists, share curated reviews, and discover seasonal releases through an engaging and intuitive user interface.',
        tech: ['React', 'TypeScript', 'UI/UX Design', 'Anime/Manga API', 'CSS Grid']
      }
    };

    // Sound FX (Electro Chime synthesized via Web Audio)
    let audioCtx = null;
    function playElectroChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc1.type = 'triangle';
        osc2.type = 'sine';
        
        // Crisp, electric Inazuma harmonic chime (B5 & F#6)
        osc1.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5
        osc2.frequency.setValueAtTime(1479.98, audioCtx.currentTime); // F#6
        osc1.frequency.exponentialRampToValueAtTime(1975.53, audioCtx.currentTime + 0.22); // B6
        
        gain.gain.setValueAtTime(0.14, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.42);
        
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.42);
        osc2.stop(audioCtx.currentTime + 0.42);
      } catch (e) {
        // Audio policy fallback
      }
    }

    // Modal Control
    const modal = document.getElementById('project-modal');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalImg = document.getElementById('modal-project-img');
    const modalTitle = document.getElementById('modal-title');
    const modalTag = document.getElementById('modal-tag');
    const modalBody = document.getElementById('modal-body');
    const modalTechStack = document.getElementById('modal-tech-stack');

    function openProjectModal(projectId) {
      const data = projectsData[projectId];
      if (!data) return;

      modalImg.src = data.img;
      modalImg.alt = data.title;
      modalTitle.textContent = data.title;
      modalTag.textContent = data.tag;
      modalBody.textContent = data.desc;

      modalTechStack.innerHTML = '';
      data.tech.forEach(tech => {
        const chip = document.createElement('span');
        chip.className = 'tech-chip';
        chip.textContent = tech;
        modalTechStack.appendChild(chip);
      });

      playElectroChime();
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeProjectModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    // Attach click events to project cards
    document.querySelectorAll('.hotspot-card').forEach(card => {
      card.addEventListener('click', () => {
        const projId = card.getAttribute('data-project');
        openProjectModal(projId);
      });
    });

    modalCloseBtn.addEventListener('click', closeProjectModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeProjectModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeProjectModal();
      }
    });

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('genshin-navbar');
      if (navbar) {
        if (window.scrollY > 30) {
          navbar.classList.add('scrolled');

    // Back Button Logic
    const backBtn = document.getElementById('footer-back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        playElectroChime();
        if (document.referrer && (document.referrer.includes('index.html') || document.referrer.includes(window.location.host))) {
          e.preventDefault();
          window.history.back();
        }
      });
    }

    // Navigation and Social audio chime on click
    document.querySelectorAll('.nav-link, .nav-brand, .hotspot-social').forEach(el => {
      el.addEventListener('click', () => {
        playElectroChime();
      });
    });

    /* =======================================================
       VIBRANT INAZUMA ELECTRO AMBIENT PARTICLES & LIGHTNING
       ======================================================= */
    (function initElectroAtmosphere() {
      const canvas = document.getElementById('elemental-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let particles = [];
      let lightningBolts = [];
      let animId = null;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      // Electro Spark: Luminescent diamond spark or electric ion orb
      class ElectroSpark {
        constructor(isInitial = false) {
          this.reset(isInitial);
        }
        reset(isInitial = false) {
          this.x = Math.random() * width;
          this.y = isInitial ? Math.random() * height : height + Math.random() * 40 + 10;
          this.size = Math.random() * 4.5 + 3.0; // 3.0px - 7.5px clearly visible!
          this.speedY = -(Math.random() * 0.75 + 0.4);
          this.speedX = (Math.random() - 0.5) * 0.6;
          this.alpha = Math.random() * 0.4 + 0.6; // 0.60 - 1.0 (bright against dark purple)
          this.maxAlpha = this.alpha;
          this.flickerSpeed = Math.random() * 0.12 + 0.06;
          this.flickerOffset = Math.random() * Math.PI * 2;
          this.type = Math.random() < 0.65 ? 'spark' : 'orb';
          this.angle = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.04;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX + (Math.random() - 0.5) * 0.75; // energetic electric jitter
          this.angle += this.rotSpeed;
          this.flickerOffset += this.flickerSpeed;

          // Fade near top edge
          if (this.y < height * 0.12) {
            this.alpha = Math.max(0, this.maxAlpha * (this.y / (height * 0.12)));
          }

          if (this.y < -25 || this.alpha <= 0) {
            this.reset(false);
          }
        }
        draw() {
          const flicker = 0.75 + 0.25 * Math.sin(this.flickerOffset);
          const currentAlpha = Math.min(1, Math.max(0.18, this.alpha * flicker));
          ctx.save();

          if (this.type === 'spark') {
            // 4-pointed electric star / spark diamond
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#d8b4fe';

            // Outer electric violet glow halo
            ctx.fillStyle = `rgba(192, 132, 252, ${currentAlpha * 0.85})`;
            ctx.beginPath();
            ctx.moveTo(0, -this.size * 1.3);
            ctx.lineTo(this.size * 0.4, 0);
            ctx.lineTo(0, this.size * 1.3);
            ctx.lineTo(-this.size * 0.4, 0);
            ctx.closePath();
            ctx.fill();

            // Horizontal crossbar
            ctx.beginPath();
            ctx.moveTo(-this.size * 0.9, 0);
            ctx.lineTo(0, this.size * 0.35);
            ctx.lineTo(this.size * 0.9, 0);
            ctx.lineTo(0, -this.size * 0.35);
            ctx.closePath();
            ctx.fill();

            // Brilliant incandescent white/violet hot center
            ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha * 0.95})`;
            ctx.beginPath();
            ctx.arc(0, 0, this.size * 0.28, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Glowing ion plasma orb
            ctx.shadowBlur = 14;
            ctx.shadowColor = '#c084fc';
            ctx.fillStyle = `rgba(235, 215, 255, ${currentAlpha * 0.9})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Hot white core
            ctx.fillStyle = `rgba(255, 255, 255, ${currentAlpha})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.25, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      // Inazuma Micro-Lightning Bolt: vivid branching electric discharge
      class LightningBolt {
        constructor() {
          this.life = 0;
          this.maxLife = Math.floor(Math.random() * 7 + 8); // 8 to 15 frames for visible duration
          this.branches = [];

          const startX = Math.random() * width;
          const startY = Math.random() * (height * 0.85) + 50;

          // Generate main lightning trunk
          const segments = [];
          let cx = startX;
          let cy = startY;
          const segCount = Math.floor(Math.random() * 4 + 4); // 4-7 segments
          const totalLength = Math.random() * 55 + 35; // 35px - 90px
          const mainAngle = Math.random() * Math.PI * 2;

          segments.push({ x: cx, y: cy });
          for (let s = 1; s <= segCount; s++) {
            const step = totalLength / segCount;
            cx += Math.cos(mainAngle) * step + (Math.random() - 0.5) * 16;
            cy += Math.sin(mainAngle) * step + (Math.random() - 0.5) * 16;
            segments.push({ x: cx, y: cy });
          }
          this.branches.push({ segments, width: 2.0 });

          // Fork branch with 60% chance
          if (Math.random() < 0.6 && segments.length > 2) {
            const forkIdx = Math.floor(segments.length / 2);
            const forkStart = segments[forkIdx];
            const forkSegs = [forkStart];
            let fx = forkStart.x;
            let fy = forkStart.y;
            const forkAngle = mainAngle + (Math.random() < 0.5 ? 0.7 : -0.7);
            const forkLen = totalLength * 0.55;
            const forkCount = 3;
            for (let f = 1; f <= forkCount; f++) {
              fx += Math.cos(forkAngle) * (forkLen / forkCount) + (Math.random() - 0.5) * 12;
              fy += Math.sin(forkAngle) * (forkLen / forkCount) + (Math.random() - 0.5) * 12;
              forkSegs.push({ x: fx, y: fy });
            }
            this.branches.push({ segments: forkSegs, width: 1.2 });
          }
        }
        update() {
          this.life++;
          return this.life < this.maxLife;
        }
        draw() {
          const progress = this.life / this.maxLife;
          const alpha = (1 - progress) * 0.95;
          ctx.save();
          ctx.shadowBlur = 14;
          ctx.shadowColor = '#d8b4fe';

          for (const b of this.branches) {
            // Outer bright violet aura
            ctx.strokeStyle = `rgba(192, 132, 252, ${alpha * 0.8})`;
            ctx.lineWidth = b.width + 1.8;
            ctx.beginPath();
            ctx.moveTo(b.segments[0].x, b.segments[0].y);
            for (let i = 1; i < b.segments.length; i++) {
              ctx.lineTo(b.segments[i].x, b.segments[i].y);
            }
            ctx.stroke();

            // Inner hot white lightning core
            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.lineWidth = b.width;
            ctx.beginPath();
            ctx.moveTo(b.segments[0].x, b.segments[0].y);
            for (let i = 1; i < b.segments.length; i++) {
              ctx.lineTo(b.segments[i].x, b.segments[i].y);
            }
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      const PARTICLE_COUNT = 48;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new ElectroSpark(true));
      }

      let frameCount = 0;
      function loop() {
        ctx.clearRect(0, 0, width, height);
        frameCount++;

        // Spawn vivid lightning discharge every ~28 frames regularly
        if (frameCount % 28 === 0) {
          lightningBolts.push(new LightningBolt());
        }

        // Occasional secondary crackle
        if (frameCount % 65 === 0 && Math.random() < 0.65) {
          lightningBolts.push(new LightningBolt());
        }

        // Draw and update sparks
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }

        // Draw and update lightning bolts
        lightningBolts = lightningBolts.filter(bolt => {
          const alive = bolt.update();
          if (alive) bolt.draw();
          return alive;
        });

        animId = requestAnimationFrame(loop);
      }

      animId = requestAnimationFrame(loop);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animId) cancelAnimationFrame(animId);
          animId = null;
        } else if (!animId) {
          animId = requestAnimationFrame(loop);
        }
      });
    })();
  </script>
