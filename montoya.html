    // Sound FX (Geo Chime synthesized via Web Audio)
    let audioCtx = null;
    function playGeoChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc1.type = 'sine';
        osc2.type = 'triangle';
        
        // Warm, resonant Liyue Geo bell tone (C5 & G5)
        osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc2.frequency.setValueAtTime(783.99, audioCtx.currentTime); // G5
        osc1.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.35); // C6
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
        
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.55);
        osc2.stop(audioCtx.currentTime + 0.55);
      } catch (e) {
        // Audio policy fallback
      }
    }

    // Modal Control
    const modal = document.getElementById('project-modal');

    function openProjectModal(projectId) {
      const data = projectsData[projectId];

      modalImg.src = data.img;
      modalImg.alt = data.title;
      modalTitle.textContent = data.title;
      modalTag.textContent = data.tag;
      modalBody.textContent = data.desc;

      data.tech.forEach(tech => {
        const chip = document.createElement('span');
        chip.className = 'tech-chip';
        chip.textContent = tech;
        modalTechStack.appendChild(chip);
      });

      playGeoChime();
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function openPubmatModal(pubmatId) {

        chip.className = 'tech-chip';

        modalTechStack.appendChild(chip);
      });

      playGeoChime();
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeProjectModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    // Attach click events to project cards and About Me

        openProjectModal(projId);
      });
    });

    // Attach click events to pubmats
    document.querySelectorAll('.hotspot-pubmat').forEach(pubmat => {
      pubmat.addEventListener('click', () => {
        const id = pubmat.getAttribute('data-pubmat');
        openPubmatModal(id);
      });
    });

    modalCloseBtn.addEventListener('click', closeProjectModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeProjectModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeProjectModal();
      }
    });

    // Navbar scroll effect
    window.addEventListener('scroll', () => {

    if (backBtn) {

    /* =======================================================
       SUBTLE GEO AMBIENT PARTICLES (CRYSTAL SHARDS & GOLD DUST)
       ======================================================= */
    (function initGeoAtmosphere() {
      const canvas = document.getElementById('elemental-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let particles = [];
      let animId = null;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      class GeoCrystalParticle {
        constructor(isInitial = false) {
          this.reset(isInitial);
        }
        reset(isInitial = false) {
          this.x = Math.random() * width;
          this.y = isInitial ? Math.random() * height : height + Math.random() * 30 + 10;
          this.isCrystal = Math.random() < 0.55; // 55% geometric crystal shards, 45% golden dust
          this.size = this.isCrystal ? Math.random() * 3.5 + 2.5 : Math.random() * 1.5 + 0.8;
          this.speedY = -(Math.random() * 0.4 + 0.25); // calm, steady Geo drift
          this.speedX = (Math.random() - 0.5) * 0.2;
          this.angle = Math.random() * Math.PI * 2;
          this.rotSpeed = (Math.random() - 0.5) * 0.018;
          this.alpha = Math.random() * 0.45 + 0.25;
          this.maxAlpha = this.alpha;
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          this.angle += this.rotSpeed;

          // Fade near top edge
          if (this.y < height * 0.15) {
            this.alpha = Math.max(0, this.maxAlpha * (this.y / (height * 0.15)));
          }

          if (this.y < -20 || this.alpha <= 0) {
            this.reset(false);
          }
        }
        draw() {
          ctx.save();
          if (this.isCrystal) {
            // Rotating diamond crystal shard
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffd57e';

            // Shard body
            ctx.fillStyle = `rgba(233, 181, 76, ${this.alpha * 0.45})`;
            ctx.strokeStyle = `rgba(255, 246, 212, ${Math.min(1, this.alpha * 0.95)})`;
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(0, -this.size);
            ctx.lineTo(this.size * 0.65, 0);
            ctx.lineTo(0, this.size);
            ctx.lineTo(-this.size * 0.65, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Inner facet sparkle
            ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.75})`;
            ctx.beginPath();
            ctx.arc(0, 0, this.size * 0.2, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Golden dust mote
            ctx.shadowBlur = 6;
            ctx.shadowColor = '#f5ba22';
            ctx.fillStyle = `rgba(255, 225, 120, ${this.alpha * 0.8})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      const PARTICLE_COUNT = 36;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new GeoCrystalParticle(true));
      }

      function loop() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        animId = requestAnimationFrame(loop);
      }

      animId = requestAnimationFrame(loop);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animId) cancelAnimationFrame(animId);
          animId = null;
        } else if (!animId) {
          animId = requestAnimationFrame(loop);
        }
      });
    })();
  </script>
