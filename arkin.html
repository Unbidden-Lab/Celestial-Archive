  <!-- ==================== 4. INTERACTION LOGIC & AUDIO ==================== -->
  <script>
    // Project Information Database (Accurate to Arkin's Mockup Data)
    const projectsData = {
      'resume-scanner': {
        title: 'Resume Scanner',
        tag: 'RESUME SCANNER • Uses AI to derive statistics.',
        img: './assets/arkin/card_resume_scanner.png',
        desc: 'An intelligent applicant screening and resume evaluation engine powered by NLP and machine learning. Parses technical resumes, extracts candidate competencies, computes role alignment scores, and provides statistical summaries to accelerate recruitment.',
        tech: ['Python', 'Natural Language Processing', 'Machine Learning', 'FastAPI', 'React', 'Data Analytics']
      },
      'hypertension': {
        title: 'Hypertension Dashboard',
        tag: 'HYPERTENSION DASHBOARD • Interactive health website.',
        img: './assets/arkin/card_hypertension.png',
        desc: 'A responsive healthcare informatics dashboard that tracks patient blood pressure logs, calculates cardiovascular health metrics, and delivers interactive visual analytics and customized lifestyle guidance for clinical monitoring.',
        tech: ['React', 'TypeScript', 'Chart.js', 'Health Informatics', 'Tailwind CSS', 'REST API']
      },
      'visual-aide': {
        title: 'Visual Aide Web Extension',
        tag: 'VISUAL AIDE WEB EXTENSION • Dyslexia reading assistant.',
        img: './assets/arkin/card_visual_aide.png',
        desc: 'An accessibility-focused browser extension engineered to enhance web reading for individuals with dyslexia. Features OpenDyslexic typography switching, custom contrast overlays, bionic reading mode, and integrated text-to-speech comprehension tools.',
        tech: ['JavaScript', 'Chrome Extension API', 'Accessibility (a11y)', 'UI/UX Design', 'Text-to-Speech']
      },
      'cyberedge': {
        title: 'CyberEdge Industries',
        tag: 'CYBEREDGE INDUSTRIES • Corporate frontend design.',
        img: './assets/arkin/card_cyberedge.png',
        desc: 'A sleek, high-performance corporate landing experience and design system crafted for a forward-looking technological firm. Features responsive modular components, high-contrast cyber motifs, and optimized interactive layouts.',
        tech: ['HTML5', 'CSS3', 'JavaScript', 'Design Systems', 'Responsive Web Design', 'Figma Prototype']
      },
      'about-me': {
        title: 'Arkin Phoenix Jaromamay',
        tag: 'ARCHON\'S PROFILE • FULL-STACK & AI ENGINEER',
        img: './assets/arkin/portrait_pyro.png',
        desc: 'The blazing technical vanguard and AI innovator of Group 4. Architect of intelligent natural language processing engines, dynamic health monitoring platforms, and accessible user experiences. Blends deep-learning algorithms with fiery Natlan Pyro passion and clean engineering discipline.',
        tech: ['Machine Learning', 'Python / FastAPI', 'Natural Language Processing', 'React / TypeScript', 'Healthcare Informatics', 'Accessibility (a11y)']
      }
    };

    // Sound FX (Natlan Pyro Chime synthesized via Web Audio)
    let audioCtx = null;
    function playPyroChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc1.type = 'sawtooth';
        osc2.type = 'triangle';
        
        // Warm, vibrant Natlan Pyro flame harmonic tone (D5 to A5)
        osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc2.frequency.setValueAtTime(880.00, audioCtx.currentTime); // A5
        osc1.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.32); // D6
        
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.5);
        osc2.stop(audioCtx.currentTime + 0.5);
      } catch (e) {
        // Audio policy fallback
      }
    }

    // Modal Control
    const modal = document.getElementById('project-modal');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalImg = document.getElementById('modal-project-img');
    const modalTitle = document.getElementById('modal-title');
    const modalTag = document.getElementById('modal-tag');
    const modalBody = document.getElementById('modal-body');
    const modalTechStack = document.getElementById('modal-tech-stack');

    function openProjectModal(projectId) {
      const data = projectsData[projectId];
      if (!data) return;

      modalImg.src = data.img;
      modalImg.alt = data.title;
      modalTitle.textContent = data.title;
      modalTag.textContent = data.tag;
      modalBody.textContent = data.desc;

      modalTechStack.innerHTML = '';
      data.tech.forEach(tech => {
        const chip = document.createElement('span');
        chip.className = 'tech-chip';
        chip.textContent = tech;
        modalTechStack.appendChild(chip);
      });

      playPyroChime();
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeProjectModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    // ==================== ABOUT ME ARCHIVAL JOURNAL MODAL CONTROL ====================
    const aboutMeModal = document.getElementById('about-me-modal');
    const bookBackBtn = document.getElementById('book-back-btn');
    const bookClasp = document.getElementById('book-hotspot-clasp');

    function openAboutMeModal() {
      playPyroChime();
      if (aboutMeModal) {
        aboutMeModal.classList.add('active');
        aboutMeModal.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }
    }

    function closeAboutMeModal() {
      if (aboutMeModal) {
        aboutMeModal.classList.remove('active');
        aboutMeModal.setAttribute('aria-hidden', 'true');
        if (!modal.classList.contains('active')) {
          document.body.style.overflow = '';
        }
      }
    }

    // Attach click event specifically to About Me button
    const aboutMeHotspot = document.getElementById('hotspot-about-me');
    if (aboutMeHotspot) {
      aboutMeHotspot.addEventListener('click', (e) => {
        e.preventDefault();
        openAboutMeModal();
      });
    }

    // Close About Me Modal events
    if (bookBackBtn) {
      bookBackBtn.addEventListener('click', (e) => {
        e.preventDefault();
        playPyroChime();
        closeAboutMeModal();
      });
    }
    if (bookClasp) bookClasp.addEventListener('click', closeAboutMeModal);
    if (aboutMeModal) {
      aboutMeModal.addEventListener('click', (e) => {
        if (e.target === aboutMeModal) {
          closeAboutMeModal();
        }
      });
    }

    // Book Heatmap Project Links (Clicking project inside book closes book and opens project modal)
    document.querySelectorAll('.book-heatmap-project').forEach(btn => {
      btn.addEventListener('click', () => {
        const projId = btn.getAttribute('data-project');
        closeAboutMeModal();
        setTimeout(() => {
          openProjectModal(projId);
        }, 160);
      });
    });

    // Book Heatmap Portrait & Pyro badge chime
    document.querySelectorAll('.book-heatmap-portrait, .book-heatmap-pyro').forEach(el => {
      el.addEventListener('click', () => {
        playPyroChime();
      });
    });

    // Attach click events to project cards
    document.querySelectorAll('.hotspot-card').forEach(card => {
      card.addEventListener('click', () => {
        const projId = card.getAttribute('data-project');
        openProjectModal(projId);
      });
    });

    modalCloseBtn.addEventListener('click', closeProjectModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeProjectModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (modal.classList.contains('active')) {
          closeProjectModal();
        }
        if (aboutMeModal && aboutMeModal.classList.contains('active')) {
          closeAboutMeModal();
        }
      }
    });

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('genshin-navbar');
      if (navbar) {
        if (window.scrollY > 30) {
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
      }
    });

    // Back Button Logic
    const backBtn = document.getElementById('footer-back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        playPyroChime();
        if (document.referrer && (document.referrer.includes('index.html') || document.referrer.includes(window.location.host))) {
          e.preventDefault();
          window.history.back();
        }
      });
    }

    try {
      sessionStorage.setItem('celestial_archive_visited', 'true');
    } catch (e) {}

    // Navigation and Social audio chime on click
    document.querySelectorAll('.nav-link, .nav-brand, .hotspot-social').forEach(el => {
      el.addEventListener('click', () => {
        try {
          sessionStorage.setItem('celestial_archive_visited', 'true');
        } catch (e) {}
        playPyroChime();
      });
    });

    /* =======================================================
       SUBTLE PYRO AMBIENT PARTICLES (EMBERS & FLAME MOTES)
       ======================================================= */
    (function initPyroAtmosphere() {
      const canvas = document.getElementById('elemental-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let width = 0;
      let height = 0;
      let dpr = 1;
      let particles = [];
      let animId = null;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      class PyroEmber {
        constructor(isInitial = false) {
          this.reset(isInitial);
        }
        reset(isInitial = false) {
          this.x = Math.random() * width;
          this.y = isInitial ? Math.random() * height : height + Math.random() * 30 + 10;
          this.radius = Math.random() * 2.8 + 1.2; // 1.2px - 4px
          this.speedY = -(Math.random() * 0.55 + 0.35); // warm upward drift
          this.sway = Math.random() * Math.PI * 2;
          this.swaySpeed = Math.random() * 0.02 + 0.01;
          this.swayAmp = Math.random() * 0.6 + 0.3;
          this.alpha = Math.random() * 0.45 + 0.3;
          this.maxAlpha = this.alpha;
          this.heat = Math.random() * 0.4 + 0.6; // 0.6 - 1.0 (cooling factor)
          this.isAsh = Math.random() < 0.25; // 25% are fine ash motes
          if (this.isAsh) {
            this.radius = Math.random() * 1.2 + 0.8;
            this.speedY = -(Math.random() * 0.35 + 0.2);
          }
        }
        update() {
          this.y += this.speedY;
          this.sway += this.swaySpeed;
          this.x += Math.sin(this.sway) * this.swayAmp;

          // As ember rises, it cools down
          const heightRatio = Math.max(0, Math.min(1, this.y / height));
          this.heat = 0.4 + 0.6 * heightRatio;

          // Fade near top edge
          if (this.y < height * 0.15) {
            this.alpha = Math.max(0, this.maxAlpha * (this.y / (height * 0.15)));
          }

          if (this.y < -20 || this.alpha <= 0) {
            this.reset(false);
          }
        }
        draw() {
          ctx.save();
          if (this.isAsh) {
            // Fine ash speck with faint warm glow
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#ff6f40';
            ctx.fillStyle = `rgba(255, 170, 119, ${this.alpha * 0.7})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Glowing flame ember
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff6f40';

            // Dynamic color according to thermal cooling
            let r = 255;
            let g = Math.floor(111 + this.heat * 110); // 111 (orange) to 221 (hot yellow)
            let b = Math.floor(64 + this.heat * 50);

            // Outer ember aura
            ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${this.alpha * 0.85})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();

            // Hot incandescence center
            if (this.heat > 0.6) {
              ctx.fillStyle = `rgba(255, 255, 230, ${this.alpha * 0.95})`;
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.radius * 0.38, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();
        }
      }

      const PARTICLE_COUNT = 36;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new PyroEmber(true));
      }

      function loop() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < particles.length; i++) {
          particles[i].update();
          particles[i].draw();
        }
        animId = requestAnimationFrame(loop);
      }

      animId = requestAnimationFrame(loop);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animId) cancelAnimationFrame(animId);
          animId = null;
        } else if (!animId) {
          animId = requestAnimationFrame(loop);
        }
      });
    })();
  </script>
