<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkin Phoenix Jaromamay • Pyro Portfolio</title>
  
  <!-- Preconnect & Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Crimson+Pro:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Dedicated Pyro Stylesheet -->
  <link rel="stylesheet" href="./arkin.css">
</head>
<body class="arkin-portfolio-body">

  <!-- ==================== FIXED TOP NAVIGATION BAR ==================== -->
  <nav class="genshin-navbar" id="genshin-navbar">
    <a href="index.html#home" class="nav-brand" title="Return to Celestial Archive Home" aria-label="Celestial Archive Home">
      <img src="./assets/images/celestia_star.png" class="nav-logo-star" alt="Celestia Star Logo">
    </a>

    <ul class="nav-links">
      <li><a href="index.html#home" class="nav-link">Home</a></li>
      <li><a href="index.html#travelers" class="nav-link">Travelers</a></li>
      <li><a href="index.html#contact" class="nav-link">Contact</a></li>
    </ul>
  </nav>

  <!-- ==================== MAIN FULL-BLEED PORTFOLIO DISPLAY ==================== -->
  <main class="portfolio-container" id="portfolio-container">
    
    <!-- High-Resolution Mockup Vector Rendering (Full Bleed 100% Width) -->
    <picture>
      <source srcset="./assets/arkin/portfolio_mockup_hd.webp" type="image/webp">
      <img src="./assets/arkin/portfolio_mockup_hd.png" alt="Arkin Phoenix Jaromamay • Natlan Pyro Portfolio" class="portfolio-mockup-image" loading="eager" fetchpriority="high">
    </picture>

    <!-- ==================== 1. INTERACTIVE PROJECT CARDS ==================== -->
    <button type="button" class="interactive-hotspot hotspot-card hotspot-card-resume-scanner" data-project="resume-scanner" aria-label="View Resume Scanner Details" title="Resume Scanner • AI Recruitment Statistics"></button>
    <button type="button" class="interactive-hotspot hotspot-card hotspot-card-hypertension" data-project="hypertension" aria-label="View Hypertension Dashboard Details" title="Hypertension Dashboard • Interactive Health Platform"></button>
    <button type="button" class="interactive-hotspot hotspot-card hotspot-card-visual-aide" data-project="visual-aide" aria-label="View Visual Aide Web Extension Details" title="Visual Aide Web Extension • Dyslexia Reading Assistant"></button>
    <button type="button" class="interactive-hotspot hotspot-card hotspot-card-cyberedge" data-project="cyberedge" aria-label="View CyberEdge Industries Details" title="CyberEdge Industries • Corporate Frontend Design"></button>

    <!-- ==================== 2. INTERACTIVE FOOTER HOTSPOTS ==================== -->
    <!-- Back Button (Bottom-Left Stylized Arrow) -->
    <a href="index.html#travelers" class="interactive-hotspot hotspot-back-btn" id="footer-back-btn" aria-label="Back to Travelers" title="Back to Travelers"></a>

    <!-- Social Links (Bottom-Right) -->
    <a href="mailto:jaromamay.arkin@example.com" class="interactive-hotspot hotspot-social hotspot-footer-email" aria-label="Send Email to Arkin" title="Email Arkin"></a>
    <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="interactive-hotspot hotspot-social hotspot-footer-linkedin" aria-label="LinkedIn Profile" title="LinkedIn Profile"></a>
    <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="interactive-hotspot hotspot-social hotspot-footer-github" aria-label="GitHub Profile" title="GitHub Profile"></a>

  </main>

  <!-- ==================== 3. PROJECT DETAIL MODAL ==================== -->
  <div class="project-modal-backdrop" id="project-modal" aria-hidden="true" role="dialog">
    <div class="project-modal-card">
      <button class="modal-close-btn" id="modal-close-btn" aria-label="Close Modal">✕</button>
      
      <div class="modal-header">
        <img src="./assets/arkin/card_resume_scanner.png" id="modal-project-img" class="modal-card-preview" alt="Project Preview">
        <div class="modal-titles">
          <span class="modal-tag" id="modal-tag">AI Application</span>
          <h3 class="modal-title" id="modal-title">Resume Scanner</h3>
        </div>
      </div>

      <div class="modal-body" id="modal-body">
        <!-- Injected via JavaScript -->
      </div>

      <div class="modal-tech-stack" id="modal-tech-stack">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </div>

  <!-- ==================== 4. INTERACTION LOGIC & AUDIO ==================== -->
  <script>
    // Project Information Database (Accurate to Arkin's Mockup Data)
    const projectsData = {
      'resume-scanner': {
        title: 'Resume Scanner',
        tag: 'RESUME SCANNER • Uses AI to derive statistics.',
        img: './assets/arkin/card_resume_scanner.png',
        desc: 'An intelligent applicant screening and resume evaluation engine powered by NLP and machine learning. Parses technical resumes, extracts candidate competencies, computes role alignment scores, and provides statistical summaries to accelerate recruitment.',
        tech: ['Python', 'Natural Language Processing', 'Machine Learning', 'FastAPI', 'React', 'Data Analytics']
      },
      'hypertension': {
        title: 'Hypertension Dashboard',
        tag: 'HYPERTENSION DASHBOARD • Interactive health website.',
        img: './assets/arkin/card_hypertension.png',
        desc: 'A responsive healthcare informatics dashboard that tracks patient blood pressure logs, calculates cardiovascular health metrics, and delivers interactive visual analytics and customized lifestyle guidance for clinical monitoring.',
        tech: ['React', 'TypeScript', 'Chart.js', 'Health Informatics', 'Tailwind CSS', 'REST API']
      },
      'visual-aide': {
        title: 'Visual Aide Web Extension',
        tag: 'VISUAL AIDE WEB EXTENSION • Dyslexia reading assistant.',
        img: './assets/arkin/card_visual_aide.png',
        desc: 'An accessibility-focused browser extension engineered to enhance web reading for individuals with dyslexia. Features OpenDyslexic typography switching, custom contrast overlays, bionic reading mode, and integrated text-to-speech comprehension tools.',
        tech: ['JavaScript', 'Chrome Extension API', 'Accessibility (a11y)', 'UI/UX Design', 'Text-to-Speech']
      },
      'cyberedge': {
        title: 'CyberEdge Industries',
        tag: 'CYBEREDGE INDUSTRIES • Corporate frontend design.',
        img: './assets/arkin/card_cyberedge.png',
        desc: 'A sleek, high-performance corporate landing experience and design system crafted for a forward-looking technological firm. Features responsive modular components, high-contrast cyber motifs, and optimized interactive layouts.',
        tech: ['HTML5', 'CSS3', 'JavaScript', 'Design Systems', 'Responsive Web Design', 'Figma Prototype']
      }
    };

    // Sound FX (Natlan Pyro Chime synthesized via Web Audio)
    let audioCtx = null;
    function playPyroChime() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc1.type = 'sawtooth';
        osc2.type = 'triangle';
        
        // Warm, vibrant Natlan Pyro flame harmonic tone (D5 to A5)
        osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc2.frequency.setValueAtTime(880.00, audioCtx.currentTime); // A5
        osc1.frequency.exponentialRampToValueAtTime(1174.66, audioCtx.currentTime + 0.32); // D6
        
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.5);
        osc2.stop(audioCtx.currentTime + 0.5);
      } catch (e) {
        // Audio policy fallback
      }
    }

    // Modal Control
    const modal = document.getElementById('project-modal');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalImg = document.getElementById('modal-project-img');
    const modalTitle = document.getElementById('modal-title');
    const modalTag = document.getElementById('modal-tag');
    const modalBody = document.getElementById('modal-body');
    const modalTechStack = document.getElementById('modal-tech-stack');

    function openProjectModal(projectId) {
      const data = projectsData[projectId];
      if (!data) return;

      modalImg.src = data.img;
      modalImg.alt = data.title;
      modalTitle.textContent = data.title;
      modalTag.textContent = data.tag;
      modalBody.textContent = data.desc;

      modalTechStack.innerHTML = '';
      data.tech.forEach(tech => {
        const chip = document.createElement('span');
        chip.className = 'tech-chip';
        chip.textContent = tech;
        modalTechStack.appendChild(chip);
      });

      playPyroChime();
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeProjectModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    // Attach click events to project cards
    document.querySelectorAll('.hotspot-card').forEach(card => {
      card.addEventListener('click', () => {
        const projId = card.getAttribute('data-project');
        openProjectModal(projId);
      });
    });

    modalCloseBtn.addEventListener('click', closeProjectModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeProjectModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeProjectModal();
      }
    });

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('genshin-navbar');
      if (navbar) {
        if (window.scrollY > 30) {
          navbar.classList.add('scrolled');
        } else {
          navbar.classList.remove('scrolled');
        }
      }
    });

    // Back Button Logic
    const backBtn = document.getElementById('footer-back-btn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        playPyroChime();
        if (document.referrer && (document.referrer.includes('index.html') || document.referrer.includes(window.location.host))) {
          e.preventDefault();
          window.history.back();
        }
      });
    }

    // Navigation and Social audio chime on click
    document.querySelectorAll('.nav-link, .nav-brand, .hotspot-social').forEach(el => {
      el.addEventListener('click', () => {
        playPyroChime();
      });
    });
  </script>
</body>
</html>
