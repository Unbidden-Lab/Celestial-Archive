<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 1024" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Diamond pattern for cream region matching Genshin UI -->
    <pattern id="mDiamondPattern" width="36" height="36" patternUnits="userSpaceOnUse">
      <polygon points="18,0 36,18 18,36 0,18" fill="none" stroke="rgba(180, 160, 140, 0.13)" stroke-width="1.0"/>
      <polygon points="18,8 28,18 18,28 8,18" fill="none" stroke="rgba(180, 160, 140, 0.06)" stroke-width="0.6"/>
    </pattern>

    <!-- Deep Fontaine Navy Gradient -->
    <linearGradient id="mNavyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142236"/>
      <stop offset="50%" stop-color="#192b45"/>
      <stop offset="100%" stop-color="#223a5d"/>
    </linearGradient>

    <!-- Warm Celestial Cream Gradient -->
    <linearGradient id="mCreamGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="50%" stop-color="#f4f0e6"/>
      <stop offset="100%" stop-color="#ece5d6"/>
    </linearGradient>

    <!-- Soft Cyan Glow Filter -->
    <filter id="mCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Deep Navy Base in Upper-Right -->
  <rect width="450" height="1024" fill="url(#mNavyGrad)"/>

  <!-- 2. Celestial Astrolabe Concentric Rings in Navy Region -->
  <g id="m-astrolabe" stroke="rgba(255,255,255,0.18)" fill="none">
    <circle cx="220" cy="300" r="140" stroke-width="1.2"/>
    <circle cx="220" cy="300" r="230" stroke-width="1.0" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="220" cy="300" r="330" stroke-width="0.9" stroke="rgba(255,255,255,0.09)"/>

    <!-- Glowing Orbit Dot on Ring 1 -->
    <circle cx="178" cy="262" r="5" fill="#ffffff" stroke="none" filter="url(#mCyanGlow)"/>

    <!-- Axis Line -->
    <line x1="-20" y1="180" x2="450" y2="520" stroke="rgba(255,255,255,0.10)" stroke-width="1.0"/>
  </g>

  <!-- Far Right Celestial Pinstripes -->
  <line x1="438" y1="0" x2="438" y2="1024" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
  <line x1="442" y1="0" x2="442" y2="1024" stroke="rgba(255,255,255,0.08)" stroke-width="0.8"/>

  <!-- 3. Cream Area with Exact Curve from Mockup -->
  <!-- Sweeps from (0, 235) through (280, 340) to (450, 610) -->
  <path d="M 0 235 C 140 245, 280 340, 450 610 L 450 1024 L 0 1024 Z" fill="url(#mCreamGrad)"/>
  <path d="M 0 235 C 140 245, 280 340, 450 610 L 450 1024 L 0 1024 Z" fill="url(#mDiamondPattern)"/>

  <!-- 4. Sweeping White Wave Boundary Line with Cyan Underglow -->
  <path d="M 0 235 C 140 245, 280 340, 450 610" fill="none" stroke="rgba(100, 181, 246, 0.55)" stroke-width="7" filter="url(#mCyanGlow)"/>
  <path d="M 0 235 C 140 245, 280 340, 450 610" fill="none" stroke="#ffffff" stroke-width="3.0"/>
</svg>