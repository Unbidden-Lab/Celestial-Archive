<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1600" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Diamond pattern for cream region matching Genshin UI -->
    <pattern id="diamondPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <polygon points="24,0 48,24 24,48 0,24" fill="none" stroke="rgba(180, 160, 140, 0.13)" stroke-width="1.2"/>
      <polygon points="24,10 38,24 24,38 10,24" fill="none" stroke="rgba(180, 160, 140, 0.06)" stroke-width="0.8"/>
    </pattern>

    <!-- Fine navy hatch pattern -->
    <pattern id="navyHatch" width="32" height="32" patternUnits="userSpaceOnUse">
      <line x1="0" y1="32" x2="32" y2="0" stroke="rgba(255,255,255,0.022)" stroke-width="1"/>
    </pattern>

    <!-- Deep Fontaine Navy Gradient -->
    <linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142236"/>
      <stop offset="45%" stop-color="#192b45"/>
      <stop offset="100%" stop-color="#223a5d"/>
    </linearGradient>

    <!-- Warm Celestial Cream Gradient -->
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f8f5ee"/>
      <stop offset="50%" stop-color="#f4f0e6"/>
      <stop offset="100%" stop-color="#ece5d6"/>
    </linearGradient>

    <!-- Soft Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Deep Navy Base in Upper-Right -->
  <rect width="1920" height="1600" fill="url(#navyGrad)"/>
  <rect width="1920" height="1600" fill="url(#navyHatch)"/>

  <!-- 2. Celestial Astrolabe Concentric Rings in Navy Region -->
  <g id="astrolabe-group" stroke="rgba(255,255,255,0.18)" fill="none">
    <!-- Astrolabe Center at (1220, 520) -->
    <circle cx="1220" cy="520" r="320" stroke-width="1.8"/>
    <circle cx="1220" cy="520" r="540" stroke-width="1.6" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="1220" cy="520" r="820" stroke-width="1.4" stroke="rgba(255,255,255,0.10)"/>
    <circle cx="1220" cy="520" r="1100" stroke-width="1.2" stroke="rgba(255,255,255,0.06)"/>

    <!-- Glowing Orbit Dot on Ring 1 -->
    <circle cx="1060" cy="240" r="8.5" fill="#ffffff" stroke="none" filter="url(#cyanGlow)"/>

    <!-- Celestial Axis Line -->
    <line x1="200" y1="160" x2="1920" y2="980" stroke="rgba(255,255,255,0.11)" stroke-width="1.4"/>
  </g>

  <!-- Far Right Celestial Pinstripes -->
  <line x1="1888" y1="0" x2="1888" y2="1600" stroke="rgba(255,255,255,0.14)" stroke-width="1.8"/>
  <line x1="1894" y1="0" x2="1894" y2="1600" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>

  <!-- 3. Cream Area with Elegant Curved Wave Boundary -->
  <!-- Sweeps from (0, 340) through center (960, 480) down to (1920, 960) -->
  <path d="M 0 340 C 600 370, 1200 620, 1920 960 L 1920 1600 L 0 1600 Z" fill="url(#creamGrad)"/>
  <path d="M 0 340 C 600 370, 1200 620, 1920 960 L 1920 1600 L 0 1600 Z" fill="url(#diamondPattern)"/>

  <!-- 4. Sweeping White Wave Boundary Line with Cyan Underglow -->
  <!-- Underglow -->
  <path d="M 0 340 C 600 370, 1200 620, 1920 960" fill="none" stroke="rgba(100, 181, 246, 0.55)" stroke-width="10" filter="url(#cyanGlow)"/>
  <!-- Crisp White Curve -->
  <path d="M 0 340 C 600 370, 1200 620, 1920 960" fill="none" stroke="#ffffff" stroke-width="4.2"/>
</svg>